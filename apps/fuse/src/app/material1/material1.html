<h2 class="mb-4 text-2xl font-medium">
  Edición de Materiales

  <lib-boton-menu (accionSeleccionada)="ejecutarAccion($event)" />
</h2>

<form
  class="flex max-w-xl flex-col gap-2"
  [formGroup]="form"
  (ngSubmit)="save()"
>
  <mat-form-field>
    <mat-label>Nombre de la aplicación</mat-label>
    <input matInput [formControl]="form.controls.name" />
    @if (form.controls.name.hasError("required")) {
    <mat-error>El nombre es obligatorio</mat-error>
    }
  </mat-form-field>

  <mat-form-field>
    <mat-label>Descripción</mat-label>
    <textarea
      matInput
      cdkTextareaAutosize
      cdkAutosizeMinRows="2"
      cdkAutosizeMaxRows="4"
      [formControl]="form.controls.description"
    ></textarea>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Encargado</mat-label>
    <input
      matInput
      [formControl]="form.controls.manager"
      [matAutocomplete]="managerAuto"
    />
    <mat-autocomplete #managerAuto="matAutocomplete">
      @for (manager of filteredManagers(); track manager) {
      <mat-option [value]="manager">{{ manager }}</mat-option>
      }
    </mat-autocomplete>
    @if (form.controls.manager.hasError("required")) {
    <mat-error>El encargado es obligatorio</mat-error>
    }
  </mat-form-field>

  <div>
    <button mat-flat-button color="primary" type="submit">
      Guardar-primary
    </button>

    <button mat-flat-button color="warn" type="submit">Cancelar-warn</button>

    <button mat-flat-button color="accent" type="submit">
      Actualizar-accent
    </button>

    <mat-divider class="my-2"></mat-divider>

    <button mat-flat-button class="primary" type="submit">
      Guardar-primary bk
    </button>

    <button mat-flat-button class="destructive" type="submit">
      Cancelar-red-9 bk
    </button>

    <button mat-flat-button class="tertiary" type="submit">
      Actualizar-Tertiary
    </button>

    <button mat-flat-button class="neutral" type="submit">
      Actualizar-Neutral
    </button>

    <mat-divider class="my-2"></mat-divider>
    <button mat-flat-button class="primary large" type="submit">
      Guardar-primary bk
    </button>
    <button
      mat-flat-button
      class="large [--button-bg-color:var(--color-red-9)]"
      type="submit"
    >
      Cancelar-error bk
    </button>
    <button mat-flat-button class="tertiary large" type="submit">
      Actualizar-Tertiary
    </button>
  </div>
</form>
