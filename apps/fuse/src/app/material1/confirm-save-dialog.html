<mat-toolbar>
  <span class="grow">Confirmar guardado</span>
  <button mat-icon-button [mat-dialog-close]="false" aria-label="Cerrar">
    <mat-icon fontSet="material-symbols-outlined">close</mat-icon>
  </button>
</mat-toolbar>

<mat-dialog-content>
  <p class="pt-4">
    Se va a guardar la aplicación <strong>{{ data.name }}</strong
    >.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">Cancelar</button>
  <button mat-flat-button [mat-dialog-close]="true">Save</button>
</mat-dialog-actions>
