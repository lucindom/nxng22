<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a8325a"/>
      <stop offset="0.55" stop-color="#d4506a"/>
      <stop offset="1" stop-color="#e98577"/>
    </linearGradient>
    <linearGradient id="tile" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe0a8"/>
      <stop offset="0.5" stop-color="#ffb45e"/>
      <stop offset="1" stop-color="#ef6f45"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9e0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f08aa0" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 0 0 0 0 0.08"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="300" cy="200" rx="360" ry="240" fill="#8e4ec6" opacity="0.4" filter="url(#soft)"/>
  <ellipse cx="1300" cy="700" rx="400" ry="240" fill="#ffa057" opacity="0.4" filter="url(#soft)"/>
  <g fill="none" stroke="#ffe4e8" stroke-opacity="0.3" stroke-width="2">
    <circle cx="760" cy="500" r="330"/>
    <circle cx="760" cy="500" r="470"/>
  </g>
  <g transform="rotate(-14 800 450)">
    <rect x="260" y="380" width="380" height="380" rx="84" fill="url(#glass)" stroke="url(#rim)" stroke-width="2"/>
    <rect x="560" y="250" width="380" height="380" rx="84" fill="url(#tile)"/>
    <rect x="860" y="380" width="380" height="380" rx="84" fill="url(#glass)" stroke="url(#rim)" stroke-width="2"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)"/>
</svg>
