<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#17705e"/>
      <stop offset="0.55" stop-color="#29a383"/>
      <stop offset="1" stop-color="#5fbfa3"/>
    </linearGradient>
    <linearGradient id="sun" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe7ad"/>
      <stop offset="0.5" stop-color="#ffc15a"/>
      <stop offset="1" stop-color="#f08a3e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4f0de" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4fbf9e" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 1.6 0 0 0 -0.3 0 0 0 0 0.08"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="300" cy="760" rx="420" ry="240" fill="#0e5c7a" opacity="0.45" filter="url(#soft)"/>
  <ellipse cx="1080" cy="420" rx="320" ry="220" fill="#ffc98a" opacity="0.28" filter="url(#soft)"/>
  <circle cx="1060" cy="380" r="150" fill="url(#sun)"/>
  <g fill="url(#glass)" stroke="url(#rim)" stroke-width="2">
    <path d="M150 901V380A210 210 0 0 1 570 380V901Z"/>
    <path d="M450 901V510A210 210 0 0 1 870 510V901Z"/>
    <path d="M750 901V640A210 210 0 0 1 1170 640V901Z"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)"/>
</svg>
